[project]
name = "bluehire-backend"
requires-python = ">=3.10"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",   # Pycodestyle errors
    "E4",  # Module level import not at top of file
    "E7",  # Syntax errors
    "E9",  # Runtime errors
    "F",   # Pyflakes
    "I",   # isort (import sorting)
]
ignore = [
    "E501",  # Line too long (handled by formatter)
    "F401",  # Unused import (flagged, not ignored globally)
]
unfixable = [
    "F401",  # Unused imports must be removed manually
]

[tool.ruff.lint.per-file-ignores]
# conftest.py imports are intentionally re-exported for test modules via pytest
# fixtures; they are not "unused" in the conventional sense.
"backend/tests/conftest.py" = ["F401"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
